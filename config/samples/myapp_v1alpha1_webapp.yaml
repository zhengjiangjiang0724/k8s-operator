apiVersion: myapp.example.com/v1alpha1
kind: WebApp
metadata:
  labels:
    app.kubernetes.io/name: k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: webapp-sample
  namespace: default
spec:
  image: nginx:1.25
  replicas: 3
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    - name: APP_ENV
      value: production
    - name: LOG_LEVEL
      value: info
  serviceType: ClusterIP
  enableIngress: false
  healthCheck:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  updateStrategy: RollingUpdate
  # Uncomment to enable HPA-driven autoscaling. When set, `replicas` above
  # becomes the *initial* count and HPA owns subsequent scaling decisions.
  # autoscaling:
  #   minReplicas: 2
  #   maxReplicas: 10
  #   targetCPUUtilizationPercentage: 70
