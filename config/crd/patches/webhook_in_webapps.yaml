# Enable the conversion webhook on the WebApp CRD.
#
# kustomize will rewrite:
#   - .spec.conversion.webhook.clientConfig.service.name → prefixed name
#     (via kustomizeconfig.yaml's nameReference rule)
#   - .metadata.annotations[cert-manager.io/inject-ca-from] →
#     "<release-namespace>/<release-prefix>-serving-cert"
#     (via the replacements block in config/default/kustomization.yaml)
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    cert-manager.io/inject-ca-from: SERVICE_NAMESPACE/SERVICE_NAME
  name: webapps.myapp.example.com
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          namespace: system
          name: webhook-service
          path: /convert
      conversionReviewVersions:
        - v1
