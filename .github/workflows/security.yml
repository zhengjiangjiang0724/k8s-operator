name: Security

# Three independent security gates:
#   1. govulncheck — Go module vulnerability scan (CVE database).
#   2. Trivy filesystem — scan repo for misconfigs, secrets, vulnerable deps.
#   3. Trivy image — scan a freshly built container image.
#
# Results are exposed two ways:
#   - SARIF uploaded to GitHub Code Scanning (Security tab + PR annotations).
#     Requires Code Scanning enabled in repo Settings; the upload step is
#     made non-blocking so a misconfigured repo doesn't fail CI.
#   - SARIF stored as workflow artifact (always available, no special perms).
#
# This workflow does NOT block merge: scans inform, humans decide.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 02:00 UTC — catches newly published CVEs even when no
    # one has pushed code recently.
    - cron: "0 2 * * 1"

permissions:
  contents: read
  security-events: write   # required for upload-sarif
  actions: read            # required by codeql-action for context

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        uses: golang/govulncheck-action@7da72f730e37eeaad891fcff0a532d27ed737cd4 # v1.0.4
        with:
          go-version-file: go.mod
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          # Misconfigs catches Dockerfile / kustomize issues; secrets catches
          # accidentally committed credentials.
          scanners: vuln,misconfig,secret
          exit-code: "0"          # informational; we review findings, not block
          ignore-unfixed: true    # don't fail on CVEs without a fix yet

      - name: Upload SARIF to Code Scanning
        if: always()
        # Make this non-blocking: if the repo doesn't have Code Scanning
        # enabled (Settings → Security), the action returns "Resource not
        # accessible by integration" which would otherwise fail the job.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload SARIF as artifact (always available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 30

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v3.7.1

      - name: Build image (no push)
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          load: true
          tags: webapp-operator:scan
          cache-from: type=gha

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: webapp-operator:scan
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload SARIF as artifact (always available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 30
